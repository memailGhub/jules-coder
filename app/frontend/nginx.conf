server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for API calls
    # Requests to /api/* on the frontend Nginx server will be forwarded to the backend service
    location /api/ {
        # The name 'backend' comes from the service name in docker-compose.yml
        # Docker's internal DNS will resolve 'backend' to the backend container's IP.
        proxy_pass http://backend:8000/;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optional: Tweak timeouts, buffer sizes, etc.
        # proxy_connect_timeout       60s;
        # proxy_send_timeout          60s;
        # proxy_read_timeout          60s;
        # proxy_buffer_size           16k;
        # proxy_buffers               4 32k;
        # proxy_busy_buffers_size     64k;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
